# Config file for original model: no grid-level REs, fire_PM25 as output.
# Probabilistic PCA deprivation index but with reduced set of just 2 variables:
# child dependency % and log GDP per capita (for longer time period 2000-2019)
project:
  data_filepath: "/work/scratch-pw5/cho00/data/spatial/fire_pm_dep_paper_data/proc_data/df_af_annual.csv" # "/work/scratch-pw4/cho00/data/spatial/descriptive_stats_GDP_pc/df_af_annual.csv"
  model_save_dir: "/work/scratch-pw5/cho00/data/spatial/deprivation_pm_bhm"                               # "/work/scratch-pw4/cho00/data/spatial/deprivation_pm_bhm"
  nat_bounds_filepath: "/work/scratch-pw5/cho00/data/spatial/nat_boundaries/WB_countries_Admin0_10m"      # "/work/scratch-pw4/cho00/data/spatial/nat_boundaries/WB_countries_Admin0_10m"

environment:
  cmdstan_path: "/home/users/cho00/miniconda3/envs/ppca/bin/cmdstan"
  proj_data: "/home/users/cho00/miniconda3/envs/ppca/share/proj"

mcmc:
  chains: 4
  iter: 15000
  warmup: 5000
  threads: 24
  adapt_delta: 0.95

priors:
  beta_sd: 10
  scale_dist: "cauchy"

data:
  se_indicators:
    - "log_GDP_pc"
    - "child_dep_pct"
  centre_year: true
  scale_PC1: true
  scale_y: false
  max_year: 2019

pca:
  method: "ppca"  # probabilistic PCA
  n_pcs: 2
  scale: true
  centre: true
  seed: 42
  pc1_positive_loadings: ["child_dep_pct"]
  pc1_negative_loadings: ["log_GDP_pc"]

model:
  name: "original_model"
  description: "No grid-level REs"
  outcome: "fire_PM25"
  formula_rhs: >
      0 + Intercept + PC1 * urban_rural_cat + year +
        (1 + PC1 * urban_rural_cat + year | country)
